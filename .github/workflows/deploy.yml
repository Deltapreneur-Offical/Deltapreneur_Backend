# Push to main → quality gate only. Production API is Render, not CoBrother EC2.
name: Backend quality gate

on:
  # No path filters: this is a required status check, so it must run on
  # EVERY pull request to main. With paths, a PR that misses those globs
  # would leave the check "skipped" and block merge forever.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cobrother_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install -r requirements.txt

      - name: Prepare CI environment
        run: |
          cp env.ci.example .env
          PGPASSWORD=ci psql -h localhost -U ci -d postgres -c "CREATE DATABASE cobrother_ci_app;" || true
          PGPASSWORD=ci psql -h localhost -U ci -d postgres -c "CREATE DATABASE cobrother_ci_test;" || true

      - name: Validate Alembic migration graph
        run: python scripts/check_alembic_graph.py

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Verify application imports
        run: python -c "from app.main import app; print('routes', len(app.routes))"

      - name: Run backend test suite
        run: |
          pytest app/tests -q