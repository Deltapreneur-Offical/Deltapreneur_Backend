name: Alembic Graph Check

on:
  # No path filters: this is a required status check, so it must run on
  # EVERY pull request to main (otherwise it stays "skipped" and blocks merge).
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  alembic-graph:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate single Alembic head
        run: python scripts/check_alembic_graph.py
