name: Alembic Graph Check

on:
  pull_request:
    paths:
      - "alembic/**"
      - "scripts/check_alembic_graph.py"
      - "scripts/merge_alembic_heads.py"
  push:
    branches:
      - main
    paths:
      - "alembic/**"

jobs:
  alembic-graph:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate single Alembic head
        run: python scripts/check_alembic_graph.py
