services:
  - type: web
    name: cobrother-backend
    runtime: python
    plan: starter   # free tier spins down; see notes below
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      # Add secrets in Render dashboard or sync: false entries

databases:
  - name: cobrother-db
    plan: free    # or starter for production